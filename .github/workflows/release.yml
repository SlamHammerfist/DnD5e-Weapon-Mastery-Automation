name: Release

# Push a tag like v1.5.0 to build module.zip and publish a GitHub release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          FILE_VERSION="$(jq -r .version module.json)"
          if [ "$FILE_VERSION" != "$VERSION" ]; then
            echo "::warning::module.json says $FILE_VERSION but the tag is $GITHUB_REF_NAME. The release uses $VERSION."
          fi

      - name: Build module.zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DOWNLOAD: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/module.zip
        run: |
          mkdir build dist
          git archive HEAD | tar -x -C build
          jq --arg v "$VERSION" --arg d "$DOWNLOAD" '.version = $v | .download = $d' \
            module.json > build/module.json
          cp build/module.json dist/module.json
          (cd build && zip -r ../dist/module.zip .)
          unzip -l dist/module.zip

      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## " v "([ (]|$)" { f = 1; next }
            /^## / { f = 0 }
            f
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::warning::No CHANGELOG.md section for $VERSION."
            echo "Release $VERSION" > notes.md
          fi
          cat notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/module.zip dist/module.json \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag
